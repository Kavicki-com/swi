services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: swi
      POSTGRES_PASSWORD: swi
      POSTGRES_DB: swi
    ports: ["5432:5432"]
    volumes: ["swi_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swi"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]   # 1025 SMTP · 8025 UI web

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]   # 9000 S3 API · 9001 console
    volumes: ["swi_minio:/data"]

  # Cria o bucket uma vez (em AWS = IaC). Mantém o Nest sem rede pro MinIO no boot.
  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_started }
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo waiting-minio; sleep 1; done;
      mc mb --ignore-existing local/swi-media;
      echo bucket-ready; exit 0;
      "

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
      mailhog: { condition: service_started }
      minio-init: { condition: service_completed_successfully }   # bucket pronto antes do 1º upload
    environment:
      DATABASE_URL: postgresql://swi:swi@db:5432/swi
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      # Default = MailHog (dev). Pra e-mail REAL (teste com cliente), defina no
      # .env as variantes API_SMTP_* (prefixadas de propósito: o .env já tem
      # SMTP_HOST=localhost na perspectiva do HOST, e interpolar esse nome aqui
      # vazaria localhost pra DENTRO do container, quebrando o MailHog):
      #   API_SMTP_HOST=smtp.resend.com  API_SMTP_PORT=465  API_SMTP_SECURE=1
      #   API_SMTP_USER=resend  API_SMTP_PASS=<api key>
      #   API_MAIL_FROM=<remetente verificado no Resend>
      SMTP_HOST: ${API_SMTP_HOST:-mailhog}
      SMTP_PORT: ${API_SMTP_PORT:-1025}
      SMTP_SECURE: ${API_SMTP_SECURE:-}
      SMTP_USER: ${API_SMTP_USER:-}
      SMTP_PASS: ${API_SMTP_PASS:-}
      MAIL_FROM: ${API_MAIL_FROM:-no-reply@swi.local}
      # QA Web #9 — destinatário das denúncias de mensagem. Sem default: com a
      # env vazia a rota responde 503 em vez de "enviar" pra ninguém.
      REPORT_TO_EMAIL: ${API_REPORT_TO_EMAIL:-}
      PORT: 3000
      # Origins do painel swi-admin no CORS HTTP (CSV). Default = dev server do Vite.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Mídia (Fatia 2). MINIO_PUBLIC_URL = host que as URLs presigned usam (a
      # assinatura é atada ao host). Android emu → http://10.0.2.2:9000; device
      # sobre ngrok → domínio do túnel; AWS → unset (SDK usa o S3 real).
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-swi-media}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      # STACK DEV/DEMO SÓ. default 'alert' = fidelidade Figma (mostra a tempestade + dispara clima→notif).
      # PRODUÇÃO (AWS ECS) NÃO usa este compose e DEIXA WEATHER_SCENARIO UNSET → sem alerta fabricado.
      WEATHER_SCENARIO: ${WEATHER_SCENARIO:-alert}
      # STACK DEV/DEMO SÓ: simulador de posições (move os workers do seed pelo
      # site e alimenta o pipeline REAL de heartbeat). PRODUÇÃO deixa unset —
      # lá a fonte é o GPS do app mobile.
      SIM_POSITIONS: ${SIM_POSITIONS:-1}
      WEATHER_CRON: ${WEATHER_CRON:-}                # vazio → default 30min no código
      # STACK DEV/DEMO SÓ. Vazio → RouteProvider usa OSRM público (keyless) = rota real no container.
      # PRODUÇÃO (AWS ECS) injeta o token Mapbox do cliente aqui (perfil walking premium).
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    ports: ["3000:3000"]
    command: sh -c "npx prisma migrate deploy && node dist/main"

volumes:
  swi_pgdata:
  swi_minio:
