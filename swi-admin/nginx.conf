# Servidor estático do painel no pacote de duplo clique.
#
# O build do Vite é uma SPA: só existe um index.html, e as rotas (/dashboard,
# /alerts/:id) são resolvidas no navegador pelo react-router. Servido por um
# servidor estático comum, recarregar a página em qualquer rota que não seja a
# raiz devolve 404, porque o arquivo /dashboard não existe em disco. O
# `try_files` abaixo é o que faz o F5 funcionar; é o mesmo papel do `rewrites`
# do vercel.json na publicação da Vercel.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão dos ativos de texto. Os .js do painel passam de 200 kB cada;
    # sem isto o primeiro carregamento na máquina do cliente fica visivelmente
    # mais lento sem nenhum ganho em troca.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Os ativos levam hash de conteúdo no nome (index-a1b2c3d4.js), então uma
    # versão nova nunca reusa o mesmo caminho e o cache longo é seguro.
    # Um único add_header, e não `expires 1y` mais um add_header: as duas
    # diretivas juntas emitem DOIS cabeçalhos Cache-Control na mesma resposta.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # =404 em vez de cair no fallback: um asset que não existe precisa
        # responder 404. Devolvendo index.html, o navegador tentaria executar
        # HTML como JavaScript e o erro viraria "Unexpected token '<'", que não
        # diz nada sobre o arquivo que está faltando.
        try_files $uri =404;
    }

    # O index.html NÃO pode ser cacheado: é ele que aponta para os ativos com
    # hash. Cacheado, o cliente que atualizar o pacote continuaria abrindo o
    # bundle antigo e nada explicaria por quê.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
