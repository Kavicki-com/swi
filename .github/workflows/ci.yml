name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nada além de ler o repositório: nenhum job comenta em PR, publica artefato
# ou usa credencial de produção.
permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Coerência do projeto Expo: versões de pacote compatíveis com o SDK,
      # config válida. Pega drift de dependência que os testes não veem.
      - run: npx expo-doctor
      - run: npm run lint
      - run: npm run typecheck
      # Com o coverageThreshold de 80 do jest.config aplicado.
      - run: npm run test:coverage
      # Exporta Android, iOS e web num passo só. É o smoke de build: bundle
      # que não fecha derruba o job aqui, antes de chegar em aparelho.
      - run: npm run build:all
      # mobile/e2e/web-smoke.spec.ts existe e passa, mas fica fora do CI de
      # propósito: o bundle web do Expo com --clear domina o tempo do job, e o
      # único produto web suportado na entrega é o painel. Roda localmente com
      # `npm run test:e2e:managed`.

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swi-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: swi-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # --coverage liga os thresholds de 80 do vitest.config.
      - run: npm test -- --coverage
      # Nenhum arquivo de src acima de 800 linhas (portão da decomposição).
      - run: npm run gate:file-size
      - run: npm run build
      - run: npm run storybook:build
      # O E2E de navegador vive no job admin-e2e, separado: ele sobe Docker e
      # compila o backend, e misturar isso aqui faria o job de lint e teste
      # esperar pela stack inteira.

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swi-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 é o runtime oficial único do repositório, o mesmo declarado
          # em .nvmrc, no `engines` dos três projetos e no Dockerfile. Manter a
          # CI em uma linha só é deliberado: pg-boss v12 é ESM-only e estoura
          # ERR_REQUIRE_ESM em runtime anterior, que o Docker local não
          # reproduz, então a divergência só apareceria depois do deploy.
          #
          # A hospedagem da API roda 22.11.0, da mesma linha LTS deste pin. Por
          # isso o `engines` dos três projetos declara a FAIXA >=22.11.0 <23 e
          # não a versão exata: pin exato somado a engine-strict faz a
          # instalação falhar no deploy por diferença de patch.
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: swi-backend/package-lock.json
      - run: npm ci
      # O client do Prisma é gerado, não versionado: sem isto nem o typecheck
      # nem o build acham os tipos de @prisma/client.
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      # Só os unitários, com o coverageThreshold de 80 do jest.config. Os E2E
      # falam com Postgres de verdade e vivem no job backend-integration.
      - run: npm run test:coverage
      - run: npm run build

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swi-backend
    services:
      postgres:
        # Mesma imagem e mesmas credenciais descartáveis do docker-compose de
        # teste; nada aqui alcança dado real.
        image: postgres:16
        env:
          POSTGRES_USER: swi
          POSTGRES_PASSWORD: swi
          POSTGRES_DB: swi
        ports:
          - 5432:5432
        # O job só começa com o Postgres respondendo de verdade: a porta
        # publicada aceita conexão antes de o servidor terminar de subir, e
        # sem o health check o migrate deploy correria contra a inicialização.
        options: >-
          --health-cmd "pg_isready -U swi -d swi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://swi:swi@localhost:5432/swi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: swi-backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # As suítes E2E instanciam o AppModule em processo, então a única
      # infraestrutura real que elas pedem é o banco. NODE_ENV, o JWT
      # descartável e os MINIO_* vêm de test/setup-e2e.ts, carregado como
      # setupFiles antes de qualquer spec: por isso este job não precisa
      # declarar nenhuma dessas variáveis, e um spec novo não precisa lembrar
      # de repetir o preâmbulo.
      - run: npm run test:e2e

  # E2E de navegador do painel, o único produto web suportado na entrega.
  # Separado dos jobs de lint e teste porque sobe Docker e compila o backend.
  #
  # O runner (scripts/e2e/run-test-stack.mjs) sobe a infraestrutura descartável
  # em portas próprias, aplica migrations, roda o seed e derruba tudo num
  # finally. Ele injeta o próprio JWT descartável, então este job não precisa
  # de segredo nenhum: sem isso o `docker compose` morreria na interpolação de
  # `${JWT_SECRET:?...}` num checkout limpo, que é exatamente o caso do CI.
  admin-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: swi-admin/package-lock.json
      - run: npm ci
        working-directory: swi-admin
      # O webServer do Playwright sobe a API de verdade (`npm run build &&
      # start:prod` em ../swi-backend) e o runner roda migrate e seed com cwd
      # lá, então o backend precisa das dependências e do client do Prisma.
      - run: npm ci
        working-directory: swi-backend
      - run: npx prisma generate
        working-directory: swi-backend
      # Só o Chromium: a suíte roda em um projeto só, e baixar os três
      # navegadores triplicaria o tempo do job sem cobrir mais nada.
      - run: npx playwright install --with-deps chromium
        working-directory: swi-admin
      - run: npm run test:e2e:managed
        working-directory: swi-admin

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: node --test scripts/quality/assert-client-hygiene.test.mjs
      # Portão de higiene do código entregue ao cliente. Cobre por enquanto as
      # áreas já revisadas, e cada lote de limpeza acrescenta a sua aqui até a
      # lista sumir e a varredura passar a valer para o repositório inteiro.
      # Ligá-lo de uma vez faria a CI nascer vermelha por meses, que é o mesmo
      # erro descrito logo abaixo no portão de vulnerabilidades.
      - run: >
          node scripts/quality/assert-client-hygiene.mjs
          --dir .github
          --dir scripts
          --dir mobile
      # Portão de vulnerabilidades. Bloqueia de verdade, sem continue-on-error.
      #
      # O `npm audit` cru não servia como portão: ele mistura o que tem conserto
      # com o que não tem, e conta como achado do projeto todo pacote que apenas
      # DEPENDE de um vulnerável. Rodá-lo direto nascia vermelho sem ação
      # possível, e portão que nasce vermelho é portão que se aprende a ignorar.
      #
      # check-audit.mjs confronta os achados com scripts/security/audit-policy.json,
      # onde cada tolerância tem pacote, advisory, justificativa, responsável e
      # prazo de no máximo 90 dias. Exceção vencida BLOQUEIA, então a lista não
      # apodrece em silêncio.
      #
      # Precisa das dependências instaladas: `npm audit` lê a árvore resolvida,
      # não o package.json.
      - run: npm ci
        working-directory: mobile
      - run: npm ci
        working-directory: swi-admin
      - run: npm ci
        working-directory: swi-backend
      - run: node scripts/security/check-audit.mjs
      # Os testes do portão. Rodam aqui porque é onde a falha importa: um
      # portão quebrado passa tudo.
      - run: node --test scripts/security/check-audit.test.mjs
      # Scanner de segredos do snapshot, versão fixada e saída mascarada
      # (--redact). Este bloqueia: segredo em árvore de entrega para tudo.
      # O .gitleaks.toml da raiz allowlista só falso-positivos verificados
      # (artefatos Figma em docs/ e props key de JSX).
      - run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.28.0
          dir /repo --config /repo/.gitleaks.toml --redact --no-banner
